# Builds the APK, runs the unit tests and lint, and attaches the APK to a GitHub Release: a tag
# tv-v<version> gets a release of its own (tv-v1.2.0: "Hallway for Android TV 1.2.0"), and a push to
# main that changes the app the rolling prerelease tv-latest. The release's APK is always
# hallway-tv.apk, so the latest release's has a fixed address (README, "Installing it").
#
# Signed with the owner's key when the repository's secrets hold one (README, "Signing"), else with
# the runner's debug key, which is new on every run.
name: APK

on:
  push:
    branches: [main]
    tags: ['tv-v*'] # path filters don't apply to tags: every tv-v tag builds
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, for the version of a build from main

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6

      # The version: a tag's (tv-v1.2.0: 1.2.0), else git describe's from the last tag
      # (1.2.0-3-gabc1234), else 0.0.0-g<commit>. It must start with a digit: the hallway tells the
      # app by "HallwayTV/<digit>" in the user agent. The code is the run number, so it only grows.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/tv-v* ]]; then
            name="${GITHUB_REF_NAME#tv-v}"
          else
            name="$(git describe --tags --match 'tv-v[0-9]*' 2>/dev/null | sed 's/^tv-v//')"
            name="${name:-0.0.0-g$(git rev-parse --short HEAD)}"
          fi
          if [[ ! "$name" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::A version starts with a digit (tv-v1.2.0), not: $name"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Release key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.HALLWAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HALLWAY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=the owner's release key" >> "$GITHUB_OUTPUT"
          else
            echo "signed=a debug key made for this build: to install a later one, uninstall this first" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, test, lint
        env:
          HALLWAY_KEYSTORE_PASSWORD: ${{ secrets.HALLWAY_KEYSTORE_PASSWORD }}
          HALLWAY_KEY_ALIAS: ${{ secrets.HALLWAY_KEY_ALIAS }}
          HALLWAY_KEY_PASSWORD: ${{ secrets.HALLWAY_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease test lint
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/tv-v')
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          apk="$RUNNER_TEMP/hallway-tv.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          notes="The hallway (https://ariamokr.github.io/hallway/) on an Android TV, version $NAME ($GITHUB_SHA), signed with $SIGNED. The README says how to install it."
          if [[ "$GITHUB_REF" == refs/tags/tv-v* ]]; then
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
            else
              gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag --title "Hallway for Android TV $NAME" --notes "$notes"
            fi
          else
            # tv-latest moves to this commit: the release and its tag go, and come back here.
            gh release delete tv-latest --cleanup-tag --yes > /dev/null 2>&1 || true
            gh release create tv-latest "$apk" --prerelease --target "$GITHUB_SHA" \
              --title "Hallway for Android TV, latest from main ($NAME)" --notes "$notes"
          fi
